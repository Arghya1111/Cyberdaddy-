version: "3.9"

# ============================================================
# CyberDaddy - Docker Compose (Production)
# ============================================================

services:
  # ----------------------------------------------------------
  # PostgreSQL Database
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: cyberdaddy_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-cyberdaddy}
      POSTGRES_USER: ${DB_USER:-cyberdaddy_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - cyberdaddy_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cyberdaddy_user} -d ${DB_NAME:-cyberdaddy}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # Redis - Cache + Celery Broker
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: cyberdaddy_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - cyberdaddy_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # Django API Server
  # ----------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: cyberdaddy_api
    restart: unless-stopped
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2 --timeout 120 --access-logfile - --error-logfile -
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
    env_file:
      - .env
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cyberdaddy_net

  # ----------------------------------------------------------
  # Celery Worker - General Tasks
  # ----------------------------------------------------------
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: cyberdaddy_celery_worker
    restart: unless-stopped
    command: celery -A config.celery_app worker --loglevel=info --concurrency=4 -Q default,scans,notifications,ai
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    networks:
      - cyberdaddy_net

  # ----------------------------------------------------------
  # Celery Beat - Periodic Task Scheduler
  # ----------------------------------------------------------
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: cyberdaddy_celery_beat
    restart: unless-stopped
    command: celery -A config.celery_app beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    networks:
      - cyberdaddy_net

  # ----------------------------------------------------------
  # Celery Flower - Task Monitoring UI
  # ----------------------------------------------------------
  flower:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: cyberdaddy_flower
    restart: unless-stopped
    command: celery -A config.celery_app flower --port=5555
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
    env_file:
      - .env
    ports:
      - "5555:5555"
    depends_on:
      - redis
    networks:
      - cyberdaddy_net

  # ----------------------------------------------------------
  # Nginx - Reverse Proxy
  # ----------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: cyberdaddy_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    networks:
      - cyberdaddy_net

volumes:
  postgres_data:
  redis_data:
  static_files:
  media_files:

networks:
  cyberdaddy_net:
    driver: bridge
