      properties:
        status:
          $ref: '#/components/schemas/HealthCheckStatusEnum'
        services:
          $ref: '#/components/schemas/HealthCheckService'
      required:
      - services
      - status
    HealthCheckService:
      type: object
      properties:
        database:
          type: string
        cache:
          type: string
      required:
      - cache
      - database
    HealthCheckStatusEnum:
      enum:
      - healthy
      - degraded
      type: string
      description: |-
        * `healthy` - healthy
        * `degraded` - degraded
    JoinFamily:
      type: object
