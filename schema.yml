      required:
      - query
    ThreatSearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/ThreatDatabaseList'
        count:
          type: integer
      required:
      - count
      - results
    ThreatStatsResponse:
      type: object
      properties:
        total_active_threats:
          type: integer
        by_category:
          type: array
          items:
            type: object
            additionalProperties: {}
        by_severity:
          type: array
          items:
            type: object
            additionalProperties: {}
        most_reported:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - by_category
      - by_severity
      - most_reported
      - total_active_threats
    ThreatTrendsResponse:
      type: object
      properties:
        weekly_scan_trend:
          type: array
          items:
            type: object
            additionalProperties: {}
        monthly_safety_trend:
          type: array
          items:
            type: object
            additionalProperties: {}
        scam_categories_breakdown:
          type: object
          additionalProperties: {}
        top_scam_categories:
          type: array
          items:
            type: string
      required:
      - monthly_safety_trend
      - scam_categories_breakdown
      - top_scam_categories
      - weekly_scan_trend
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenVerify:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
      required:
      - token
    UnreadCountResponse:
      type: object
      properties:
        unread_count:
          type: integer
      required:
      - unread_count
    UpdateMemberRole:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/RoleEnum'
        can_be_monitored:
          type: boolean
          description: If True, this member's activity appears on family dashboard
        alert_parent_on_threat:
          type: boolean
          description: If True, parents/guardians are alerted when this member encounters
            a threat
        permissions:
          description: Fine-grained permission overrides for this member
    UserProfile:
      type: object
      description: Full user profile — used in auth responses and profile endpoints.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        full_name:
          type: string
          maxLength: 255
        phone_number:
          type: string
          nullable: true
          maxLength: 20
        avatar:
          type: string
          format: uri
          nullable: true
        account_type:
          $ref: '#/components/schemas/AccountTypeEnum'
        account_status:
          allOf:
          - $ref: '#/components/schemas/AccountStatusEnum'
          readOnly: true
        is_email_verified:
          type: boolean
        is_phone_verified:
          type: boolean
        safety_score:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          readOnly: true
          description: AI-calculated safety score (0-100)
        timezone:
          type: string
          maxLength: 50
        language:
          type: string
          maxLength: 10
        notification_preferences:
          description: User notification channel preferences
        date_joined:
          type: string
          format: date-time
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - account_status
      - date_joined
      - email
      - full_name
      - id
      - last_login
      - safety_score
    UserProfileUpdate:
      type: object
      description: Partial update for user profile (name, timezone, preferences).
      properties:
        full_name:
          type: string
          maxLength: 255
        phone_number:
          type: string
          nullable: true
          maxLength: 20
        avatar:
          type: string
          format: uri
          nullable: true
        date_of_birth:
          type: string
          format: date
          nullable: true
        timezone:
          type: string
          maxLength: 50
        language:
          type: string
          maxLength: 10
        notification_preferences:
          description: User notification channel preferences
      required:
      - full_name
    UserRegistration:
      type: object
      description: Handles new user registration with password confirmation.
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        full_name:
          type: string
          maxLength: 255
        phone_number:
          type: string
          nullable: true
          maxLength: 20
        password:
          type: string
          writeOnly: true
        confirm_password:
          type: string
          writeOnly: true
      required:
      - confirm_password
      - email
      - full_name
      - password
    UserSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Unique identifier (UUID v4)
        device_name:
          type: string
          readOnly: true
          description: Human-readable device name (e.g., 'iPhone 15 Pro')
        device_type:
          allOf:
          - $ref: '#/components/schemas/DeviceTypeEnum'
          readOnly: true
        os_info:
          type: string
          readOnly: true
        browser_info:
          type: string
          readOnly: true
        ip_address:
          type: string
          readOnly: true
          nullable: true
        location_city:
          type: string
          readOnly: true
        location_country:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        last_active_at:
          type: string
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: Record creation timestamp
      required:
      - browser_info
      - created_at
      - device_name
      - device_type
      - id
      - ip_address
      - is_active
      - last_active_at
      - location_city
      - location_country
      - os_info
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
