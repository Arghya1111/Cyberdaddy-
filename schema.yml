components:
  schemas:
    AIInsight:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Unique identifier (UUID v4)
        safety_score:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          description: Current AI-calculated safety score
        safety_score_trend:
          $ref: '#/components/schemas/SafetyScoreTrendEnum'
        risk_profile:
          $ref: '#/components/schemas/RiskProfileEnum'
        total_scans:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        total_threats_detected:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        threats_blocked_this_month:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        threat_frequency_score:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          description: Average threats encountered per week
        top_scam_categories:
          description: Ranked list of scam categories this user encounters most
        weekly_scan_trend:
          description: '[{week: ''YYYY-WW'', scans: N, threats: N}, ...] for the past
            12 weeks'
        monthly_safety_trend:
          description: '[{month: ''YYYY-MM'', safety_score: N}, ...] for the past
            6 months'
        recommendations:
          description: Personalized safety recommendations from AI analysis
        personalized_tips:
          description: Behavioral safety tips tailored to this user's threat profile
        scam_categories_breakdown:
          description: Category → count breakdown of all detected scams
        ai_narrative:
          type: string
          description: Full AI-written safety narrative for the user's weekly report
        last_analyzed_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: Record last update timestamp
      required:
      - id
      - updated_at
    AccountStatusEnum:
      enum:
      - active
      - inactive
      - suspended
      - pending_verification
      type: string
      description: |-
        * `active` - Active
        * `inactive` - Inactive
        * `suspended` - Suspended
        * `pending_verification` - Pending Email Verification
    AccountTypeEnum:
      enum:
      - individual
      - family_admin
      - family_member
      - enterprise
      type: string
      description: |-
        * `individual` - Individual
        * `family_admin` - Family Admin
        * `family_member` - Family Member
        * `enterprise` - Enterprise
    BillingCycleEnum:
      enum:
      - monthly
      - yearly
      - lifetime
      type: string
      description: |-
        * `monthly` - Monthly
        * `yearly` - Yearly
        * `lifetime` - Lifetime
    CancelSubscriptionResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        access_until:
          type: string
          format: date-time
          nullable: true
      required:
      - access_until
      - message
      - success
    CategoryEnum:
      enum:
      - phishing
      - financial_fraud
      - lottery_scam
      - romance_scam
      - tech_support
      - impersonation
      - job_scam
      - upi_fraud
      - malware
      - social_engineering
      - fake_ecommerce
      - cryptocurrency
      - other
      type: string
      description: |-
        * `phishing` - Phishing
        * `financial_fraud` - Financial / Investment Fraud
        * `lottery_scam` - Lottery / Prize Scam
        * `romance_scam` - Romance Scam
        * `tech_support` - Tech Support Scam
        * `impersonation` - Government / Bank Impersonation
        * `job_scam` - Fake Job Offer
        * `upi_fraud` - UPI / Payment Fraud
        * `malware` - Malware / Ransomware
        * `social_engineering` - Social Engineering
        * `fake_ecommerce` - Fake E-Commerce
        * `cryptocurrency` - Cryptocurrency Fraud
        * `other` - Other
    ChangePassword:
      type: object
      properties:
        current_password:
          type: string
        new_password:
          type: string
        confirm_password:
          type: string
      required:
      - confirm_password
      - current_password
      - new_password
    ChannelEnum:
      enum:
      - push
      - email
      - sms
      - in_app
      type: string
      description: |-
        * `push` - Push Notification
        * `email` - Email
        * `sms` - SMS
        * `in_app` - In-App
    ConfirmPasswordReset:
      type: object
      properties:
        token:
          type: string
        new_password:
          type: string
        confirm_password:
          type: string
      required:
      - confirm_password
      - new_password
      - token
    CyberDaddyTokenObtainPair:
      type: object
      description: |-
        Customized JWT serializer that embeds user claims into the token payload.
        This reduces DB lookups for basic user info in downstream services.
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    DeviceTypeEnum:
      enum:
      - mobile
      - tablet
      - desktop
      - other
      type: string
      description: |-
        * `mobile` - Mobile
        * `tablet` - Tablet
        * `desktop` - Desktop
        * `other` - Other
    EmailVerification:
      type: object
      properties:
        token:
          type: string
      required:
      - token
    ErrorDetail:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    ErrorResponse:
      type: object
      description: 'Standard error response: {"success": false, "error": {"message":
        "..."}}'
      properties:
        success:
          type: boolean
        error:
          $ref: '#/components/schemas/ErrorDetail'
      required:
      - error
      - success
    FamilyDashboard:
      type: object
      description: Aggregated family safety dashboard — matches GET /api/v1/family/dashboard/
        response.
      properties:
        group:
          $ref: '#/components/schemas/FamilyGroup'
        member_count:
          type: integer
        total_scans_this_month:
          type: integer
        threats_this_month:
          type: integer
        average_safety_score:
          type: number
          format: double
        member_safety_scores:
          type: array
          items:
            $ref: '#/components/schemas/MemberSafetyScore'
      required:
      - average_safety_score
      - group
      - member_count
      - member_safety_scores
      - threats_this_month
      - total_scans_this_month
    FamilyGroup:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Unique identifier (UUID v4)
        name:
          type: string
          description: Family group display name
          maxLength: 100
        description:
          type: string
        avatar:
          type: string
          format: uri
          nullable: true
        admin:
          allOf:
          - $ref: '#/components/schemas/UserProfile'
          readOnly: true
        invite_code:
          type: string
          readOnly: true
          description: 6-12 character unique invite code (case-insensitive)
        is_invite_active:
          type: boolean
        member_count:
          type: integer
          readOnly: true
        max_members:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        status:
          $ref: '#/components/schemas/FamilyGroupStatusEnum'
        average_safety_score:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          readOnly: true
        total_scans:
          type: integer
          readOnly: true
        threats_detected:
          type: integer
          readOnly: true
        members:
          type: array
          items:
            $ref: '#/components/schemas/FamilyMember'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: Record creation timestamp
      required:
      - admin
      - average_safety_score
      - created_at
      - id
      - invite_code
      - member_count
      - members
      - name
      - threats_detected
      - total_scans
    FamilyGroupCreate:
      type: object
      properties:
        name:
          type: string
          description: Family group display name
          maxLength: 100
        description:
          type: string
        avatar:
          type: string
          format: uri
          nullable: true
      required:
      - name
    FamilyGroupStatusEnum:
