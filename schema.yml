openapi: 3.0.3
info:
  title: CyberDaddy API
  version: 1.0.0
  description: AI-powered Family Cybersecurity SaaS Platform
  contact:
    email: dev@cyberdaddy.in
  license:
    name: Proprietary
paths:
  /api/health/:
    get:
      operationId: health_retrieve
      description: |-
        Health check endpoint for load balancers, K8s probes, and Docker HEALTHCHECK.
        Returns 200 OK if all critical services are reachable.
      summary: Service health check
      tags:
      - Health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheck'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheck'
          description: ''
  /api/v1/family/create/:
    post:
      operationId: v1_family_create_create
      description: |-
        POST /api/v1/family/create/
        Create a new family group. User becomes the admin.
        Requires Family Plan subscription.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FamilyGroupCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FamilyGroupCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FamilyGroupCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyGroupCreate'
          description: ''
  /api/v1/family/dashboard/:
    get:
      operationId: v1_family_dashboard_retrieve
      description: |-
        GET /api/v1/family/dashboard/
        Aggregated family safety dashboard with member stats.
      summary: Family safety dashboard
      tags:
      - Family
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyDashboard'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/family/group/:
    get:
      operationId: v1_family_group_retrieve
      description: |-
        GET  /api/v1/family/group/    → Get family group details
        PATCH /api/v1/family/group/   → Update group name/description (admin only)
      summary: Get/Update family group
      tags:
      - Family
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyGroup'
          description: ''
    put:
      operationId: v1_family_group_update
      description: |-
        GET  /api/v1/family/group/    → Get family group details
        PATCH /api/v1/family/group/   → Update group name/description (admin only)
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FamilyGroup'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FamilyGroup'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FamilyGroup'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyGroup'
          description: ''
    patch:
      operationId: v1_family_group_partial_update
      description: |-
        GET  /api/v1/family/group/    → Get family group details
        PATCH /api/v1/family/group/   → Update group name/description (admin only)
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedFamilyGroup'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedFamilyGroup'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedFamilyGroup'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyGroup'
          description: ''
  /api/v1/family/invite/regenerate/:
    post:
      operationId: v1_family_invite_regenerate_create
      description: |-
        POST /api/v1/family/invite/regenerate/
        Generate a new invite code (invalidates the old one).
      summary: Regenerate invite code
      tags:
      - Family
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegenerateInviteCodeResponse'
          description: ''
  /api/v1/family/join/:
    post:
      operationId: v1_family_join_create
      description: |-
        POST /api/v1/family/join/
        Join a family group using an invite code.
      summary: Join family with invite code
      tags:
      - Family
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinFamily'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/JoinFamily'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/JoinFamily'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinFamilyResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/family/members/:
    get:
      operationId: v1_family_members_list
      description: |-
        GET /api/v1/family/members/
        List all members of the user's family group.
      summary: List family members
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Family
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFamilyMemberList'
          description: ''
  /api/v1/family/members/{id}/:
    put:
      operationId: v1_family_members_update
      description: |-
        PATCH /api/v1/family/members/<member_id>/
        Update a family member's role or monitoring settings (admin only).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRole'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateMemberRole'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UpdateMemberRole'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateMemberRole'
          description: ''
    patch:
      operationId: v1_family_members_partial_update
      description: |-
        PATCH /api/v1/family/members/<member_id>/
        Update a family member's role or monitoring settings (admin only).
      summary: Update member role
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Family
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateMemberRole'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUpdateMemberRole'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUpdateMemberRole'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateMemberRole'
          description: ''
  /api/v1/family/members/{id}/remove/:
    delete:
      operationId: v1_family_members_remove_destroy
      description: |-
        DELETE /api/v1/family/members/<member_id>/remove/
        Remove a member from the family group (admin only).
      summary: Remove family member
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Family
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/health/:
    get:
      operationId: v1_health_retrieve
      description: |-
        Health check endpoint for load balancers, K8s probes, and Docker HEALTHCHECK.
        Returns 200 OK if all critical services are reachable.
      summary: Service health check
      tags:
      - Health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheck'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheck'
          description: ''
  /api/v1/insights/dashboard/:
    get:
      operationId: v1_insights_dashboard_retrieve
      description: |-
        GET /api/v1/insights/dashboard/
        Returns full AI safety dashboard for the current user.
        Cached for 30 minutes.
      summary: Get AI safety insights dashboard
      tags:
      - Insights
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIInsight'
          description: ''
  /api/v1/insights/recommendations/:
    get:
      operationId: v1_insights_recommendations_retrieve
      description: |-
        GET /api/v1/insights/recommendations/
        Returns personalized AI safety recommendations.
      summary: Get personalized recommendations
      tags:
      - Insights
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationsResponse'
          description: ''
  /api/v1/insights/safety-score/:
    get:
      operationId: v1_insights_safety_score_retrieve
      description: |-
        GET /api/v1/insights/safety-score/
        Returns just the current safety score (lightweight, frequently polled).
      summary: Get current safety score
      tags:
      - Insights
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SafetyScoreResponse'
          description: ''
  /api/v1/insights/trends/:
    get:
      operationId: v1_insights_trends_retrieve
      description: |-
        GET /api/v1/insights/trends/
        Returns scam trend data for chart visualization.
      summary: Get scam threat trends
      tags:
      - Insights
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreatTrendsResponse'
          description: ''
  /api/v1/notifications/:
    get:
      operationId: v1_notifications_list
      description: GET /api/v1/notifications/ — List all notifications for current
        user.
      summary: List user notifications
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotificationList'
          description: ''
  /api/v1/notifications/{id}/read/:
    post:
      operationId: v1_notifications_read_create
      description: POST /api/v1/notifications/<id>/read/ — Mark notification as read.
      summary: Mark notification as read
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/notifications/read-all/:
    post:
      operationId: v1_notifications_read_all_create
      description: POST /api/v1/notifications/read-all/ — Mark all notifications as
        read.
      summary: Mark all notifications as read
      tags:
      - Notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkAllReadResponse'
          description: ''
  /api/v1/notifications/unread-count/:
    get:
      operationId: v1_notifications_unread_count_retrieve
      description: GET /api/v1/notifications/unread-count/ — Unread notification badge
        count.
      summary: Get unread notification count
      tags:
      - Notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCountResponse'
          description: ''
  /api/v1/scans/{id}/:
    get:
      operationId: v1_scans_retrieve
      description: |-
        GET /api/v1/scans/<scan_id>/
        Retrieve a specific scan result with AI analysis and threat matches.
      summary: Get scan result
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Scans
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanHistory'
          description: ''
  /api/v1/scans/history/:
    get:
      operationId: v1_scans_history_list
      description: |-
        GET /api/v1/scans/history/
        List all scans for the current user with filtering.
      summary: List scan history
      parameters:
      - in: query
        name: is_threat
        schema:
          type: boolean
        description: Filter by threat flag
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: risk_level
        schema:
          type: string
          enum:
          - critical
          - high
          - low
          - medium
          - safe
        description: Filter by risk level
      - in: query
        name: scan_type
        schema:
          type: string
          enum:
          - email
          - phone_number
          - screenshot
          - sms
          - url
        description: Filter by scan type
      - in: query
        name: status
        schema:
          type: string
          enum:
          - completed
          - failed
          - pending
          - processing
        description: Filter by scan status
      tags:
      - Scans
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedScanHistoryListList'
          description: ''
  /api/v1/scans/screenshot/:
    post:
      operationId: v1_scans_screenshot_create
      description: |-
        POST /api/v1/scans/screenshot/
        Upload a screenshot for AI scam detection (GPT-4o Vision).
      summary: Submit screenshot scan
      tags:
      - Scans
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SubmitScreenshotScan'
        required: true
      security:
      - jwtAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanSubmitResponse'
          description: ''
  /api/v1/scans/stats/:
    get:
      operationId: v1_scans_stats_retrieve
      description: |-
        GET /api/v1/scans/stats/
        Returns scan statistics for the current user's dashboard.
      summary: Get scan statistics
      tags:
      - Scans
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanStatsResponse'
          description: ''
  /api/v1/scans/text/:
    post:
      operationId: v1_scans_text_create
      description: |-
        POST /api/v1/scans/text/
        Submit a text-based scan (SMS, URL, Email, Phone Number).
        Returns immediately with scan ID; result fetched via GET /scans/<id>/
      summary: Submit text scan (SMS/URL/Email)
      tags:
      - Scans
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitTextScan'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SubmitTextScan'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SubmitTextScan'
        required: true
      security:
      - jwtAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanSubmitResponse'
          description: ''
  /api/v1/subscriptions/cancel/:
    post:
      operationId: v1_subscriptions_cancel_create
      description: |-
        POST /api/v1/subscriptions/cancel/
        Cancel subscription at end of current billing period.
      summary: Cancel subscription
      tags:
      - Subscriptions
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelSubscriptionResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/subscriptions/me/:
    get:
      operationId: v1_subscriptions_me_retrieve
      description: |-
        GET /api/v1/subscriptions/me/
        Returns current user's subscription details and plan limits.
      summary: Get current subscription
      tags:
      - Subscriptions
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
          description: ''
  /api/v1/subscriptions/plans/:
    get:
      operationId: v1_subscriptions_plans_retrieve
      description: |-
        GET /api/v1/subscriptions/plans/
        Returns all available subscription plans with pricing.
        Public endpoint — no authentication required.
      summary: List available plans
      tags:
      - Subscriptions
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlansListResponse'
          description: ''
  /api/v1/threats/:
    get:
      operationId: v1_threats_list
      description: |-
        GET /api/v1/threats/
        List all active threats with filtering by category and severity.
        Results are cached for 1 hour.
      summary: List threat intelligence database
      parameters:
      - in: query
        name: category
        schema:
          type: string
          enum:
          - cryptocurrency
          - fake_ecommerce
          - financial_fraud
          - impersonation
          - job_scam
          - lottery_scam
          - malware
          - other
          - phishing
          - romance_scam
          - social_engineering
          - tech_support
          - upi_fraud
        description: |-
          * `phishing` - Phishing
          * `financial_fraud` - Financial / Investment Fraud
          * `lottery_scam` - Lottery / Prize Scam
          * `romance_scam` - Romance Scam
          * `tech_support` - Tech Support Scam
          * `impersonation` - Government / Bank Impersonation
          * `job_scam` - Fake Job Offer
          * `upi_fraud` - UPI / Payment Fraud
          * `malware` - Malware / Ransomware
          * `social_engineering` - Social Engineering
          * `fake_ecommerce` - Fake E-Commerce
          * `cryptocurrency` - Cryptocurrency Fraud
          * `other` - Other
      - in: query
        name: is_verified
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: severity
        schema:
          type: integer
          enum:
          - 1
          - 2
          - 3
          - 4
        description: |-
          * `1` - Low
          * `2` - Medium
          * `3` - High
          * `4` - Critical
      - in: query
        name: source
        schema:
          type: string
          enum:
          - ai_detected
          - cert_in
          - external_feed
          - manual
          - rbi
          - user_reported
        description: |-
          * `manual` - Manually Added
          * `ai_detected` - AI Detected
          * `user_reported` - User Reported
          * `external_feed` - External Threat Feed
          * `cert_in` - CERT-In Advisory
          * `rbi` - RBI Advisory
      tags:
      - Threats
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedThreatDatabaseListList'
          description: ''
  /api/v1/threats/{id}/:
    get:
      operationId: v1_threats_retrieve
      description: GET /api/v1/threats/<id>/
      summary: Get threat details
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Threats
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreatDatabaseDetail'
          description: ''
  /api/v1/threats/search/:
    post:
      operationId: v1_threats_search_create
      description: |-
        POST /api/v1/threats/search/
        Search threats by text, URL, or phone number.
        Used by clients for quick threat lookups before submitting a full scan.
      summary: Search threat database
      tags:
      - Threats
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreatSearch'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ThreatSearch'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ThreatSearch'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreatSearchResponse'
          description: ''
  /api/v1/threats/stats/:
    get:
      operationId: v1_threats_stats_retrieve
      description: GET /api/v1/threats/stats/ - Threat category statistics for dashboard.
      summary: Threat statistics
      tags:
      - Threats
      security:
