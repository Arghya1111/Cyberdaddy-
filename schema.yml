        id:
          type: string
          format: uuid
          readOnly: true
          description: Unique identifier (UUID v4)
        user:
          allOf:
          - $ref: '#/components/schemas/UserProfile'
          readOnly: true
        role:
          $ref: '#/components/schemas/RoleEnum'
        role_display:
          type: string
          readOnly: true
        is_active:
          type: boolean
        can_be_monitored:
          type: boolean
          description: If True, this member's activity appears on family dashboard
        alert_parent_on_threat:
          type: boolean
          description: If True, parents/guardians are alerted when this member encounters
            a threat
        joined_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - joined_at
      - role_display
      - user
    HealthCheck:
